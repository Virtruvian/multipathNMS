<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}multipathNMS{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="pulse"></span> multipathNMS</div>
  <nav>
    <a href="/nms" class="{% if request.url.path == '/nms' %}active{% endif %}">NMS</a>
    <a href="/topology" class="{% if request.url.path == '/topology' %}active{% endif %}">Topology</a>
    <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">Settings</a>
  </nav>
  <div id="ws-state" class="ws-state">connecting</div>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
